name: Deploy OSRS dashboard to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch latest RuneProfile player model
        run: |
          mkdir -p assets
          if curl --fail --location --silent --show-error "https://api.runeprofile.com/profiles/models/DROGE%20BUIT" --output assets/player-model.glb; then
            echo "RuneProfile player model downloaded ($(wc -c < assets/player-model.glb) bytes)"
          else
            rm -f assets/player-model.glb
            echo "::warning::RuneProfile player model is not available; the dashboard will use its portrait fallback."
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          retention-days: 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
